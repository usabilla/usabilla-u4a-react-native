apply plugin: 'com.android.library'

android {
    compileSdkVersion 33

    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 33
        versionCode 1
        versionName "1.0.0"
    }
    lintOptions {
        abortOnError false
    }
}

dependencies {
    implementation 'com.usabilla.sdk:ubform:9.+'
    implementation "com.facebook.react:react-native:0.+"
}
